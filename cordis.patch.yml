# ============================================================================
# dsh-group-chat —— DSH bundle patch
# ============================================================================
# 把插件挂进 profile。安装（本地开发，link 到源码目录）：
#   dsh plugin --profile desktop add "link:C:\\Users\\PRO\\Desktop\\对话间对话"
# 然后把 "dsh-group-chat" 加进 profile package.json 的 dsh.profile.bundles。
#
# name 必须与安装后的包名完全一致，否则表现为「装上了但侧栏没有入口」。
# ============================================================================

- insert:
    - id: dsh-group-chat
      name: dsh-group-chat
